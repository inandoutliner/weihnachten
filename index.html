<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoch die Hände, Jahresende!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@300,400,500,700,400i,500i&display=swap">
<style>
:root { --orange: #f26b21; --sand: #f6c886; --cream: #fbeedb; --brown: #3a2416; --ink: #2a1a10; --white: #fff;
  --head: "Sentient", Georgia, "Times New Roman", serif; --body: "Onest", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 500 16px/1.45 var(--body); color: var(--brown); background: var(--cream); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--head); font-weight: 500; letter-spacing: -.025em; margin: 0; line-height: .9; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: var(--orange); color: var(--white); padding: 11px 18px; font: 600 14px/1 var(--body); text-decoration: none; transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s; }
.pill:hover { transform: translateY(-2px); }
.pill:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--brown); outline-offset: 3px; }
.pill.light { background: var(--white); color: var(--brown); }
.pill.dark { background: var(--brown); color: var(--cream); }
.pill.small { padding: 8px 12px; font-size: 13px; }
.pill:disabled { opacity: .45; cursor: default; transform: none; }

/* Kopf */
.topbar { position: fixed; inset: 14px 14px auto 14px; z-index: 30; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.who { white-space: nowrap; background: var(--white); border-radius: 999px; padding: 8px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 14px rgba(58,36,22,.12); }
.who select { border: 0; background: transparent; font-weight: 700; }
.demo { background: var(--brown); color: var(--sand); border-radius: 999px; padding: 6px 12px; font-size: 12px; }

/* Szenen */
.scene { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 90px 20px 60px; position: relative; overflow: hidden; }
.hero { background: var(--orange); align-items: flex-start; justify-content: flex-end; text-align: left; padding: 120px clamp(20px, 5vw, 72px) clamp(40px, 7vh, 80px); }
.hero h1 { font-size: clamp(58px, 12.6vw, 230px); color: var(--brown); line-height: .86; letter-spacing: -.035em; }
.hero h1 span { display: block; }
.hero .sub { margin-top: clamp(18px, 3vh, 30px); font-size: clamp(18px, 1.9vw, 26px); line-height: 1.2; color: var(--brown); display: flex; flex-wrap: wrap; gap: .1em .45em; }
.hero .sub .f { font-family: var(--head); font-style: italic; }
.hero .sub .c { font-family: "Comic Neue", "Comic Sans MS", cursive; font-weight: 700; }
.hero .sub .p { font-family: "Pixelify Sans", monospace; }
.month { gap: 26px; }

.month .head { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.month .head h2 { font-size: clamp(64px, 11vw, 190px); }
.month .owner { font: italic 400 clamp(24px, 2.6vw, 36px)/1 var(--head); color: var(--brown); }
.month .owner small { font: 500 13px var(--body); text-transform: none; opacity: .7; margin-left: 6px; }
.sheetWrap { position: relative; width: min(78vw, 380px, 62vh * 303 / 426); aspect-ratio: 303 / 426; border-radius: 6px; box-shadow: 0 30px 60px rgba(58,36,22,.32); transform: rotate(var(--r, -2deg)); transition: transform .4s cubic-bezier(.34,1.56,.64,1); background: #fff; }
.sheetWrap:hover { transform: rotate(0deg) scale(1.02); }
.sheetWrap canvas { width: 100%; height: 100%; display: block; border-radius: 6px; }
.month .meta { font-size: 13px; opacity: .75; }
.month .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@media (min-width: 900px) {
  .month { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: ". sheet" "head sheet" "btns sheet" "meta sheet" ". sheet"; grid-template-rows: 1fr auto auto auto 1fr; align-content: center; justify-content: stretch; text-align: left; column-gap: clamp(30px, 6vw, 110px); row-gap: 26px; padding: 80px clamp(30px, 6vw, 110px); }
  .month .head { grid-area: head; align-items: flex-start; }
  .month .btns { grid-area: btns; justify-content: flex-start; }
  .month .meta { grid-area: meta; align-self: start; }
  .month .sheetWrap { grid-area: sheet; width: min(36vw, 74vh * 303 / 426, 520px); }
}
.dl { background: var(--brown); color: var(--cream); }
.dl h2 { font-size: clamp(44px, 7vw, 100px); color: var(--sand); }
.dl p { max-width: 560px; margin: 18px auto 0; opacity: .85; }
.dl .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
.progress { margin-top: 16px; font-size: 14px; color: var(--sand); min-height: 20px; }

.wichtel { background: #1f4d3a; color: #fbeedb; }
.wichtel h2 { font-size: clamp(56px, 11vw, 150px); color: #f6c886; }
.wichtel .status { margin-top: 18px; font-size: 18px; max-width: 560px; }
.wichtel .names { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; max-width: 640px; }
.wichtel .names span { background: rgba(251,238,219,.14); border-radius: 999px; padding: 5px 11px; font-size: 14px; }
.wichtel .btns { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }

footer { background: var(--orange); color: var(--brown); text-align: center; padding: 60px 20px 70px; }
footer h2 { font-size: clamp(40px, 8vw, 120px); font-style: italic; font-weight: 400; }

.modal { position: fixed; inset: 0; z-index: 60; background: rgba(42,26,16,.55); display: grid; place-items: center; padding: 18px; }
.card { background: var(--cream); border-radius: 22px; padding: 26px 24px; width: min(460px, 100%); max-height: 92vh; overflow: auto; text-align: left; color: var(--brown); }
.card h3 { font-size: 38px; margin-bottom: 14px; }
.card label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; margin-top: 12px; }
.card input, .card select, .card textarea { border: 2px solid var(--brown); border-radius: 12px; padding: 10px 12px; background: #fff; font-weight: 500; font-size: 16px; }
.card .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.card .note { font-size: 13px; opacity: .8; margin-top: 10px; }
.card .err { color: #b3261e; font-size: 14px; margin-top: 10px; min-height: 1em; }
.reveal { text-align: center; }
.reveal .big { font: 500 clamp(40px, 10vw, 64px)/1 var(--head); color: var(--orange); margin: 10px 0; }

/* Editor */
.editor { position: fixed; inset: 0; z-index: 50; background: #2a1a10; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 64px 20px 20px; min-height: 0; }
.stage canvas { max-width: 100%; max-height: 100%; touch-action: none; display: block; }
.ebar { position: absolute; inset: 14px 14px auto 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--cream); }
.ebar h3 { font-size: 30px; color: var(--sand); }
.ebar .saved { font-size: 12px; opacity: .7; margin-left: 10px; font-family: var(--body); text-transform: none; }
.side { background: var(--cream); overflow-y: auto; padding: 18px 18px 60px; }
.side section { border-bottom: 2px dashed rgba(58,36,22,.2); padding: 16px 0; }
.side section:first-child { padding-top: 4px; }
.side h4 { margin: 0 0 10px; font: 500 21px/1 var(--head); letter-spacing: -.01em; }

.presets button { border: 0; background: #fff; border-radius: 12px; padding: 6px 6px 8px; font-size: 12px; font-weight: 700; display: grid; gap: 5px; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.presets button:nth-child(odd) { transform: rotate(-1.5deg); }
.presets button:nth-child(even) { transform: rotate(1.5deg); }
.presets button:hover { transform: rotate(0) scale(1.05); }
.presets button[aria-pressed="true"] { outline: 3px solid var(--orange); }
.presets canvas { width: 100%; aspect-ratio: 303/426; border-radius: 6px; background: #eee; }
.adds { display: flex; flex-wrap: wrap; gap: 8px; }
.fld { display: grid; gap: 4px; margin-top: 10px; font-size: 12px; font-weight: 700; }
.fld input[type=range] { width: 100%; accent-color: var(--orange); }
.fld select, .fld textarea, .fld input[type=text] { border: 2px solid var(--brown); border-radius: 10px; padding: 8px 10px; background: #fff; font-weight: 500; font-size: 15px; }
.fld textarea { min-height: 70px; resize: vertical; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(58,36,22,.25); padding: 0; }
.sw button[aria-pressed="true"] { outline: 3px solid var(--orange); outline-offset: 1px; }
.sw input[type=color] { width: 30px; height: 30px; border: 0; padding: 0; background: none; }
.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.segs button { border: 2px solid var(--brown); background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
.segs button[aria-pressed="true"] { background: var(--brown); color: var(--cream); }
.mini { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.hint { font-size: 12.5px; opacity: .75; margin: 6px 0 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--brown); color: var(--cream); padding: 10px 16px; border-radius: 999px; z-index: 80; font-size: 14px; }
@media (max-width: 860px) {
  .editor { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; }
  .stage { padding: 56px 10px 10px; }
  .presets { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.fontBtn { width: 100%; text-align: left; border: 2px solid var(--brown); border-radius: 10px; padding: 8px 12px; background: #fff; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
.fontBtn small { font: 700 11px var(--body); opacity: .55; }
.fontList { max-height: 300px; overflow-y: auto; border: 2px solid var(--brown); border-radius: 10px; background: #fff; margin-top: 6px; }
.fontList button { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border: 0; border-bottom: 1px solid rgba(58,36,22,.12); background: none; padding: 9px 12px; font-size: 21px; text-align: left; color: var(--brown); }
.fontList button small { font: 600 10px var(--body); opacity: .5; flex: none; margin-left: 8px; }
.fontList button[aria-pressed="true"] { background: var(--sand); }
.fontList .grp { font: 700 12px var(--body); padding: 10px 12px 4px; opacity: .6; }
.shapes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.shapes button { border: 2px solid transparent; background: #fff; border-radius: 10px; padding: 4px; aspect-ratio: 1; }
.shapes button[aria-pressed="true"] { border-color: var(--orange); }
.shapes canvas { width: 100%; height: 100%; display: block; }
.presets button.last { outline: 2px dashed var(--brown); outline-offset: -2px; }
</style>
</head>

function modal(html, sticky) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`; m.addEventListener('click', (e) => { if (!sticky && (e.target === m || e.target.closest('[data-x]'))) m.remove(); }); document.body.append(m); return m; }
function wichtelAction(a) {
  if (a === 'join') {
    const m = modal(`<h3>mitmachen</h3><form id="wj"><label>Name<input name="name" required maxlength="40" autocomplete="name"></label><label>E-Mail<input name="email" type="email" required autocomplete="email"></label><label>Wunsch (optional)<textarea name="wish" maxlength="300" rows="2"></textarea></label><label>Partner*in (optional, ihr zieht euch dann nicht)<input name="partner" maxlength="40" list="wl"></label><datalist id="wl">${W_PEOPLE.map((p) => `<option value="${esc(p.name)}">`).join('')}</datalist><label>Passwort (brauchst du zum Nachschauen)<input name="pw" type="password" required minlength="4"></label><label>Passwort nochmal<input name="pw2" type="password" required minlength="4"></label><p class="note">Merk dir das Passwort gut. Ohne kann niemand dein Ergebnis öffnen, auch kein Admin.</p><div class="err" id="werr"></div><div class="row"><button type="button" class="pill light" data-x>Abbrechen</button><button class="pill" type="submit">mitmachen</button></div></form>`);
    $('#wj', m).addEventListener('submit', async (e) => {
      e.preventDefault(); const f = new FormData(e.target), err = $('#werr', m);
      if (f.get('pw') !== f.get('pw2')) { err.textContent = 'Die Passwörter sind unterschiedlich.'; return; }
      err.textContent = 'Schlüssel wird erzeugt …';
      try { const keys = await makeKeys(f.get('pw')); await api.join({ name: f.get('name').trim(), email: f.get('email').trim(), wish: f.get('wish').trim(), partner: f.get('partner').trim(), ...keys }); m.remove(); toast('Du bist dabei!'); refreshWichtel(); } catch (x) { err.textContent = x.message; }
    });
  }
  if (a === 'reveal') {
    const m = modal(`<h3>wichteln</h3><form id="wr"><label>Wer bist du?<select name="id">${W_PEOPLE.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Dein Passwort<input name="pw" type="password" required></label><div class="err" id="rerr"></div><div class="row"><button type="button" class="pill light" data-x>Abbrechen</button><button class="pill" type="submit">Aufmachen</button></div></form>`);
    $('#wr', m).addEventListener('submit', async (e) => {
      e.preventDefault(); const f = new FormData(e.target), err = $('#rerr', m), p = W_PEOPLE.find((x) => x.id === f.get('id'));
      try { const box = await api.draw(p.id); if (!box) throw new Error('Für dich liegt noch nichts bereit.'); const r = await openBox(p, f.get('pw'), box); $('.card', m).innerHTML = `<div class="reveal"><p>Du beschenkst</p><div class="big">${esc(r.name)}</div>${r.wish ? `<p>Wunsch: ${esc(r.wish)}</p>` : '<p>Kein Wunsch angegeben. Überrasch!</p>'}<div class="row" style="justify-content:center"><button class="pill" data-x>Pssst, zu</button></div></div>`; } catch (x) { err.textContent = x.message; }
    });
  }
}

/* ===== Start ===== */
function whoSelect() {
  const s = $('#me'); s.innerHTML = '<option value="">wer?</option>' + PEOPLE.flatMap((p) => [p, p + 's Partner*in']).map((p) => `<option ${p === me ? 'selected' : ''}>${p}</option>`).join('');
  s.onchange = () => { me = s.value; ls.set('me', me); };
}
function gate() { // Familien-Code, damit nur ihr schreiben könnt; wird gleich gegen die Datenbank geprüft
  return new Promise((res) => {
    const saved = ls.get('code', '');
    const tryCode = async (c) => { const a = supaBackend(c); await a.verify(); ls.set('code', c); return a; };
    const ask = (msg) => {
      const m = modal(`<h3>Hallo!</h3><form id="gc"><label>Familien-Code<input name="c" required autocomplete="off"></label><p class="note">Steht in der Nachricht, mit der du den Link bekommen hast.</p><div class="err" id="gerr">${msg || ''}</div><div class="row"><button class="pill" type="submit">Los</button></div></form>`, true);
      $('#gc', m).addEventListener('submit', async (e) => {
        e.preventDefault(); const c = new FormData(e.target).get('c').trim(), err = $('#gerr', m); err.textContent = 'prüfe …';
        try { const a = await tryCode(c); m.remove(); res(a); } catch (x) { err.textContent = /row-level|security|policy|401|42501/i.test(x.message) ? 'Der Code stimmt nicht.' : 'Keine Verbindung: ' + x.message; }
      });
    };
    if (saved) tryCode(saved).then(res, () => { ls.set('code', ''); ask(''); }); else ask('');
  });
}
async function start() {
  whoSelect();
  if (CFG.supabaseUrl && CFG.supabaseKey && window.supabase) { api = await gate(); }
  else { api = demoBackend(); $('#demoBadge').hidden = false; }
  try { PAGESDATA = await api.loadPages(); } catch (e) { toast('Laden ging nicht: ' + e.message + ' (Familien-Code richtig?)', 6000); if (!api.demo && /code|permission|denied|policy/i.test(e.message)) { ls.set('code', ''); } }
  renderMain();
  if (location.hash) setTimeout(() => { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }, 50);
  document.fonts.ready.then(() => { fxCache.clear(); thumbs(); });
  setInterval(async () => { if (ED || document.hidden) return; try { PAGESDATA = await api.loadPages(); thumbs(); } catch (e) {} }, 60000);
}
start();

</script>
